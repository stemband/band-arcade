# Band Arcade's AUTOMATIC TESTS: on every pull request (and every push to main), the whole arcade is opened in
# Chromium and WebKit (≈ iPad Safari) and checked (tests/README.md says what and how; docs/engine/testing.md the rules).
#
#   1. QUICK CHECK (Chromium, ~3 min): the smoke test (every page, every game's level starts), the docs checks and the
#      core tests tagged @quick. A red ✗ here = something basic broke; the full run doesn't even start.
#   2. FULL (after QUICK CHECK passes): everything else in Chromium (2 shards) and the whole suite in WebKit (3 shards),
#      side by side on 5 machines (Playwright's --shard), plus Blocktave's and Showtime Malfunction's frame-rate
#      tests alone on their own machine (perf).
#   3. ALL TESTS: merges every shard's report into ONE "test-report" download (the HTML report with screenshots and
#      traces of anything that failed), writes the run summary (time per browser, the 10 slowest tests, every test
#      that needed a retry) and checks THE TIME BUDGET (a test over 60 s that isn't tagged @slow fails: ci-summary.js).
#      It is green only when QUICK CHECK, every FULL shard and perf passed.
#
# BRANCH PROTECTION (Settings → Branches → main → "Require status checks to pass"): select "quick check" and
# "all tests". Those two names never change, however the shards are split.
#
# Test tooling lives ONLY in tests/ (its own package.json with Playwright) and here. The site itself stays plain files:
# nothing is built, and the Pages deploy (pages.yml) doesn't wait for or depend on this workflow.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:                  # a newer push to the same pull request cancels the older run
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  quick:
    name: quick check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install the test tools
        run: npm ci
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('tests/package-lock.json') }}
      - name: Install chromium
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium
          else npx playwright install --with-deps chromium; fi
      - name: Run the @quick tests (smoke, every game starts, docs, the core tests)
        run: npx playwright test --project=chromium --grep @quick
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: quick-results.json
      - name: Summary and time budget
        if: ${{ !cancelled() }}
        run: node ci-summary.js quick-results.json
      - name: Keep the report for ALL TESTS
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-quick
          path: tests/blob-report
          retention-days: 1

  full:
    name: tests (${{ matrix.browser }} ${{ matrix.shard }})
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Chromium: everything but the @quick tests (QUICK CHECK ran those in Chromium already; its report is merged
        # in below). WebKit: the whole suite. 4 browsers at a time on each machine (ubuntu-latest has 4 cores).
        include:
          - {browser: chromium, shard: 1/2, grep: '--grep-invert @quick'}
          - {browser: chromium, shard: 2/2, grep: '--grep-invert @quick'}
          - {browser: webkit, shard: 1/3, grep: ''}
          - {browser: webkit, shard: 2/3, grep: ''}
          - {browser: webkit, shard: 3/3, grep: ''}
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install the test tools
        run: npm ci
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Install ${{ matrix.browser }}
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = true ]; then npx playwright install-deps ${{ matrix.browser }}
          else npx playwright install --with-deps ${{ matrix.browser }}; fi
      - name: Run the tests (the site is served as-is with python3 -m http.server)
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }} ${{ matrix.grep }}
      - name: Keep the report for ALL TESTS
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: tests/blob-report
          retention-days: 1

  perf:
    # a frame rate only means something with the machine to itself: one browser, nothing else running
    name: perf (frame rates, alone)
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install the test tools
        run: npm ci
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('tests/package-lock.json') }}
      - name: Install chromium
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium
          else npx playwright install --with-deps chromium; fi
      - name: Blocktave's and Showtime Malfunction's frame rates (alone on the machine, 4× CPU throttle)
        run: npx playwright test blocktave showtime-endless -g performance --project=chromium --workers=1 --reporter=list,github
        env:
          PERF: '1'

  report:
    name: all tests
    if: ${{ always() }}
    needs: [quick, full, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install the test tools
        run: npm ci
      - name: Collect every shard's report
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: tests/all-blob-reports
          merge-multiple: true
      - name: Merge them into one report
        id: merge
        if: ${{ hashFiles('tests/all-blob-reports/*.zip') != '' }}
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      - name: The test report (open index.html; screenshots and traces of anything that failed)
        if: ${{ steps.merge.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/playwright-report/
          retention-days: 14
      - name: Summary (time per browser, the 10 slowest, retried tests) and THE TIME BUDGET (60 s a test)
        if: ${{ steps.merge.outcome == 'success' }}
        run: node ci-summary.js results.json
      - name: Every job passed (quick check, every full shard, perf)
        env:
          QUICK: ${{ needs.quick.result }}
          FULL: ${{ needs.full.result }}
          PERF: ${{ needs.perf.result }}
        run: |
          echo "quick check: $QUICK, full: $FULL, perf: $PERF"
          [ "$QUICK" = success ] && [ "$FULL" = success ] && [ "$PERF" = success ]

  sounds:
    # THE SOUND FILES (tools/compress-sounds.py): nothing above its target (--check), and every file decodes at its
    # upload's length with its loop seams intact (--verify, against tests/fixtures/sound-durations.json). This change's
    # own new sounds are compressed first, as compress-sounds.yml will do once it is on main.
    name: sounds (sizes and lengths)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Compress this change's new sounds (what main does after the merge)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ]; then git fetch -q --depth=1 origin "$BASE" || true; fi
          python3 tools/compress-sounds.py --changed-since "$BASE"
      - name: Nothing above its target
        run: python3 tools/compress-sounds.py --check
      - name: Every sound decodes, at its upload's length, loops without a gap
        run: python3 tools/compress-sounds.py --verify
