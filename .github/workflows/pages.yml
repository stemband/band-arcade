# Publishes the arcade to GitHub Pages on every push to main (every merged pull request), with a fresh SITE VERSION
# (the commit's short id) stamped into shared/version.js and into every page's script and stylesheet addresses, so
# students' browsers load the new files at once instead of a cached mix of old and new (see shared/version.js).
#
# The stamp is made on the deploy's own copy of the files: nothing is committed back to main, so there is no loop
# and nothing for anyone to remember. In the repository the version stays 'dev'.
#
# MINIFY: the same copy's scripts and stylesheets are made smaller (tools/minify-site.py, esbuild, one file at a time,
# never bundled), so students' browsers have about half as much JavaScript to parse. Same file names and script tags;
# a source map next to each file keeps DevTools' line numbers real. The repository stays plain files.
#
# SOUNDS: a push that adds or changes a sound in shared/sounds/ is published by compress-sounds.yml instead, after it
# has made the sound small (the "sounds" job below skips the deploy here; compress-sounds.yml then starts this workflow).
#
# ONE-TIME SETUP (Mat): repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# (While it still says "Deploy from a branch", Pages keeps publishing main as-is, with version 'dev': the site works
#  exactly as before, just without the cache fix, and this workflow's deploy step shows a red X.)
#
# CUSTOM DOMAIN (https://bandarcade.org): set in Settings -> Pages -> Custom domain. With this workflow as the source,
# GitHub keeps that setting in the repository's settings, so no deploy can drop it (the CNAME file in the repository
# is uploaded with the site but isn't what sets the domain). Every address in the site is relative, so the same
# files work at a domain root, in a subfolder (<user>.github.io/band-arcade/) and from a double-clicked file.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" on the Actions tab re-publishes by hand (compress-sounds.yml starts it this way)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                  # one deploy at a time; a newer merge waits for the one in progress
  group: pages
  cancel-in-progress: false

jobs:
  # A push that added or changed a sound is deployed by compress-sounds.yml instead, AFTER it has shrunk the sound and
  # committed the small file, so the live site never gets the big upload. (The same file patterns as its paths filter.)
  sounds:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - id: diff
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch -q --depth=1 origin "$BEFORE" || exit 0          # unknown (a new branch): deploy as usual
          if git diff --name-only "$BEFORE" HEAD -- 'shared/sounds/*.mp3' 'shared/sounds/*.m4a' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "This push changed a sound: compress-sounds.yml compresses it, then deploys."
          fi
  deploy:
    needs: sounds
    if: needs.sounds.outputs.changed != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # THE DEPLOY PIPELINE: stamp -> minify -> fingerprint -> publish, all on this copy (the repository is never
      # minified, never commit minified files). tests.yml runs the same steps (tests/deploy.js) and the whole test
      # suite on the result before anything merges.
      - name: Stamp the site version (the commit's short id) into version.js and every page
        run: python3 tools/stamp-version.py --stamp-only "${GITHUB_SHA::7}"
      - name: Minify the published copy's .js and .css (tools/minify-site.py; a file esbuild can't read stays as it is)
        run: python3 tools/minify-site.py
      - name: The offline copy's file list (sw.js), fingerprinting the files exactly as published
        run: python3 tools/stamp-version.py --fingerprints-only "${GITHUB_SHA::7}"
      - name: Leave the test tooling out of the published site (tests/ is never loaded by the site)
        run: rm -rf tests
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
