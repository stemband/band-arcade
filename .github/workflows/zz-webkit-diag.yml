# TEMPORARY (removed before the pull request): the four WebKit tests that fail on a busy runner (Music Highway's full
# songs and slurs, Sustain Speedway's slur lap and podium race), repeated, with their diagnostics in the log.
name: WebKit diagnostics (temporary)

on:
  push:
    branches: [claude/epic-thompson-d5v5rg]

permissions:
  contents: read

concurrency:
  group: webkit-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: webkit diag ${{ matrix.copy }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: gdb (to name the crash address)
        run: sudo apt-get install -y -q gdb binutils elfutils > /dev/null
      - name: The four specs, 3 times each, 2 browsers at a time (as the real WebKit shards), WebKit drawing on the CPU
        run: npx playwright test music-highway-meters music-highway-slurs speedway-dynamics speedway-visuals --project=webkit --workers=2 --repeat-each=3 --retries=0 --reporter=list
        env:
          CI: 'true'
      - name: Where WebKit crashed
        if: always()
        run: |
          sudo dmesg -T | grep -i -E 'oom|killed process|out of memory|trap|segfault' | tail -40 || true
          LIB=$(find ~/.cache/ms-playwright -name 'libWPEWebKit-2.0.so*' -type f | head -1); echo "LIB $LIB"; file "$LIB"
          readelf -S "$LIB" | grep -E 'debug|symtab' || echo "no debug sections"
          for off in $(sudo dmesg | grep -oP 'in libWPEWebKit[^\[]*\[\K[0-9a-f]+' | sort -u); do
            echo "== offset 0x$off"
            gdb -batch -ex "info symbol 0x$off" -ex "x/6i 0x$off-12" "$LIB" 2>&1 | tail -8
            eu-addr2line -f -C -e "$LIB" 0x$off 2>&1 | head -4
          done
