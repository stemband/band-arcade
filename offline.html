<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0716">
<title>You're offline · Band Arcade</title>
<!-- THE OFFLINE PAGE: sw.js shows it (at the address that was asked for, in any folder) when there's no network and
     that page isn't stored on this device yet. So it loads nothing else: every style is here, and its colors are
     copies of the tokens in shared/theme.css. -->
<style>
  :root{--floor:#0b0716;--floor-2:#161029;--pink:#ff4fb3;--cyan:#3ae8ff;--cyan-ink:#007e9c;--yellow:#ffe14d;--deep:#06040d;
    --text-hi:#f6f2ff;--text-lo:#c3bbe0}
  html{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--floor);color:var(--text-hi);
    font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}
  main{max-width:460px;text-align:center;padding:28px 22px;border:2px solid var(--cyan);border-radius:18px;background:var(--floor-2);box-shadow:0 0 24px rgba(58,232,255,.25)}
  h1{margin:0 0 8px;font-size:26px;letter-spacing:.04em;color:var(--pink);text-shadow:0 0 12px rgba(255,79,179,.6)}
  p{margin:0 0 18px;color:var(--text-lo)}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a,button{font:inherit;font-weight:700;min-height:44px;padding:10px 20px;border-radius:12px;border:2px solid var(--cyan-ink);background:transparent;color:var(--text-hi);text-decoration:none;cursor:pointer}
  button{background:var(--yellow);border-color:var(--yellow);color:var(--deep)}
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Games you've played before still work! This page needs the internet the first time.</p>
  <div class="row">
    <button type="button" onclick="location.reload()">Try again</button>
    <a id="home" href="index.html">Back to the arcade</a>
  </div>
</main>
<script>
  // this page can be shown in any folder: the arcade's front page is at the offline copy's root
  if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(function (r) {
    if (r) document.getElementById('home').href = r.scope + 'index.html';
  });
</script>
</body>
</html>
