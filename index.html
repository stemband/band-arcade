<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<!-- the site version, fetched fresh every time (shared/version.js): an old copy of this page reloads -->
<script>document.write('<script src="shared/version.js?t=' + Date.now() + '"><\/script>');</script>
<script>window.Arcade && Arcade.checkVersion && Arcade.checkVersion('dev');</script>
<title>Band Arcade</title>
<meta name="description" content="Band practice games that listen to you play.">
<meta name="theme-color" content="#0b0716">
<link rel="icon" href="shared/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/avatar.css">
<link rel="stylesheet" href="shared/cabinets.css">
<link rel="stylesheet" href="arcade.css">
<link rel="stylesheet" href="select-player/style.css">
<link rel="stylesheet" href="shared/locker.css">
<link rel="stylesheet" href="shared/prizes.css">
</head>
<body class="floor-page">
<!-- PRESS START: the attract screen on the first visit (arcade.js). Any tap, click or key starts the arcade; that same
     gesture unlocks the audio (shared/sfx.js), so the lobby sound starts right away. -->
<button type="button" class="press-start" id="pressStart" aria-label="Press start to enter the arcade" hidden>
  <span class="ps-sign neon" id="psName" aria-hidden="true">Band Arcade</span>
  <span class="ps-start" aria-hidden="true">Press Start</span>
  <span class="ps-hint" id="psHint" aria-hidden="true">Press any key</span>
</button>
<div class="room" aria-hidden="true"></div>

<!-- THE FLOOR'S TOP BAR (the lobby, a zone, ARCADE VIEW; arcade.js): three groups. LEFT: back + where you are. CENTER (centered on
     the screen): ARCADE VIEW (LIST / CABINETS: its icon shows the mode last used), TUNE UP (the toolbox), LEADERBOARD
     (leaderboard-screen.js; hidden when no scoreboard address is set). RIGHT: your AVATAR BADGE (shared/avatar-badge.js:
     edit avatar / change instrument…) and the sound/settings button. Narrow screens: shorter labels, then icons only, then
     TUNE UP and LEADERBOARD move into the badge's menu (arcade.js fitBar) -->
<nav class="fbar" id="fbar" aria-label="Arcade">
  <div class="fb-left">
    <button type="button" class="fb-back" id="backBtn" hidden><span aria-hidden="true">←</span> <span class="fb-back-l" id="backLbl">Lobby</span></button>
    <h2 class="fb-title" id="fbTitle" hidden></h2>
  </div>
  <div class="fb-center" id="fbCenter">
    <button type="button" class="fb-btn fb-view" id="viewBtn" aria-pressed="false" aria-label="Arcade view" title="Arcade view" data-mode="cabinets">
      <svg class="fbv-list" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg><svg class="fbv-cab" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><rect x="4" y="7" width="4.5" height="13" rx="1"/><rect x="9.75" y="4" width="4.5" height="16" rx="1"/><rect x="15.5" y="7" width="4.5" height="13" rx="1"/></svg><span class="fb-l" aria-hidden="true"><span class="fb-long">Arcade view</span><span class="fb-short">View</span></span></button>
    <a class="fb-btn fb-tune" id="tuneBtn" href="note-checker/index.html" aria-label="Tune up" title="Tune up">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17a9 9 0 0 1 18 0"/><path d="M12 17l4.5-6"/><circle cx="12" cy="17" r="1.6"/><path d="M5.5 11.5l1.2 1M12 8v1.6M18.5 11.5l-1.2 1"/></svg><span class="fb-l" aria-hidden="true"><span class="fb-long">Tune up</span><span class="fb-short">Tune up</span></span></a>
    <button type="button" class="fb-btn fb-lb" id="lbBtn" aria-label="Leaderboard" title="Leaderboard" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8.5 20h7M10 17h4"/></svg><span class="fb-l" aria-hidden="true"><span class="fb-long">Leaderboard</span><span class="fb-short">Leaders</span></span></button>
  </div>
  <div class="fb-right">
    <div class="fb-avb" id="avBadge"></div>
    <div class="sound-ctl" id="soundCtl" role="group" aria-label="Sound"></div>
  </div>
</nav>

<!-- THE ZONE LOBBY: a dark arcade wall with one neon sign per zone (lobby.js draws it) -->
<section class="lobby" id="lobby" hidden aria-labelledby="arcadeName">
  <header class="sign">
    <h1 class="neon" id="arcadeName">Band Arcade</h1>
    <p id="arcadeTagline"></p>
  </header>
  <div class="lobby-cards" id="lobbyCards"></div>
  <!-- SAVE YOUR PROGRESS: now and then, a slim banner (shared/backup-nudge.js) -->
  <div class="save-nudge" id="saveNudge" role="status"></div>
  <!-- THE LEADERBOARD'S GRADE QUESTION: once, after the first star with no grade (leaderboard-screen.js askGrade) -->
  <div class="grade-ask" id="gradeAsk" role="region" aria-label="Leaderboard grade"></div>
  <div class="zones" id="zones"></div>
  <p class="note" id="demoNote" hidden>Demo mode: hold keys 1–5 to play the five notes. All levels unlocked.</p>
</section>

<!-- ONE ZONE: the cabinet carousel with only that zone's games (or ARCADE VIEW: CABINETS, #full-arcade: every game's) -->
<main class="zone" id="zoneView" hidden>
  <!-- ARCADE VIEW's switch (only in CABINETS, #full-arcade; arcade.js fills it) -->
  <div class="vsw" role="radiogroup" aria-label="Arcade view"></div>
  <section class="carousel" aria-roledescription="carousel" aria-label="Games">
    <button class="nav nav-prev" id="prevBtn" aria-label="Previous game">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4L6 12l10 8z"/></svg>
    </button>
    <div class="aisle" id="aisle"></div>
    <div class="aisle-flags" id="aisleFlags" aria-hidden="true"></div>
    <button class="nav nav-next" id="nextBtn" aria-label="Next game">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l10 8-10 8z"/></svg>
    </button>
  </section>

  <div class="lights" id="lights" role="group" aria-label="Choose a game"></div>
  <!-- the FULL ARCADE's quick jump strip: every game's marquee, zone by zone (arcade.js) -->
  <div class="jump-strip" id="jumpStrip" role="group" aria-label="Jump to a game" hidden></div>

  <section class="info" aria-live="polite">
    <p class="info-skill" id="infoSkill"></p>
    <h2 class="info-name" id="infoName"></h2>
    <p class="info-tags" id="infoTags"></p>
    <p class="hiscore" id="hiscore" hidden></p>
    <p class="info-blurb" id="infoBlurb"></p>
  </section>
</main>

<!-- ARCADE VIEW: LIST (#all-games, once called ALL GAMES): every game once, as a card (lobby.js) -->
<section class="allg" id="allView" hidden aria-labelledby="allTitle">
  <h2 class="sr" id="allTitle">All games</h2>
  <div class="vsw" role="radiogroup" aria-label="Arcade view"></div>
  <div class="allg-bar" role="group" aria-label="Filter the games">
    <button type="button" class="allg-chip" id="niFilter" aria-pressed="false"><span class="allg-chk" aria-hidden="true"></span>No instrument needed</button>
    <span class="allg-count" id="allCount" aria-live="polite"></span>
  </div>
  <div class="allg-grid" id="allGrid"></div>
</section>

<!-- a game that doesn't suit the student's instrument (games.js fit) -->
<div class="overlay" id="fitDlg" hidden>
  <div class="panel fit-panel" role="dialog" aria-modal="true" aria-labelledby="fitTitle">
    <div class="fit-pic" id="fitPic"></div>
    <h2 id="fitTitle"></h2>
    <p id="fitWhy"></p>
    <div class="acts"><button type="button" class="btn btn-primary" id="fitSwitch">Switch instrument</button><button type="button" class="btn btn-secondary" id="fitClose">Back</button></div>
  </div>
</div>

<!-- CHOOSE YOUR INSTRUMENT (Select Player): a view on this page (select-player/player.js), so the audio unlocked on the floor stays
     unlocked. URL: index.html?game=<id>; select-player/index.html?game=<id> redirects here. -->
<div class="sp-view" id="selectView" hidden>
<div class="wrap sp">
  <div class="topbar"><a class="brand" id="spBack" href="index.html" aria-label="Back to the arcade"><span aria-hidden="true">←</span><span>Arcade</span></a><div class="topbar-right"><div class="sound-ctl" id="spSound" role="group" aria-label="Sound"></div><div class="avb-slot" id="spBadge"></div></div></div>

  <header class="sp-head">
    <div class="sp-marquee" id="marquee"></div>
    <h1 class="sp-title" id="spTitle">Choose your instrument</h1>
  </header>

  <section class="continue" id="continue" hidden>
    <a class="btn-continue" id="continueBtn" href="#">
      <span class="c-pic" id="continuePic" aria-hidden="true"></span>
      <span class="c-text"><span class="c-label">Continue as</span><span class="c-name" id="continueName"></span></span>
    </a>
  </section>
  <p class="sp-msg" id="spMsg" role="status" hidden></p>

  <div class="sp-main">
    <!-- the highlighted instrument, big, with its player card -->
    <aside class="preview" id="preview" aria-live="polite">
      <div class="pv-stage"><div class="pv-pic" id="pvPic"></div><div class="pv-inst" id="pvInst" aria-hidden="true"></div></div>
      <div class="card">
        <p class="card-player"><span class="cp-tag" id="cpTag">1P</span> <b id="cPlayer"></b></p>
        <div class="card-avatar" id="cAvBtns"><button type="button" class="btn-edit" id="editBtn">Edit player</button><button type="button" class="btn-edit" id="guestRand" hidden>Surprise me</button></div>
        <p class="card-fam" id="cFam"></p>
        <h2 class="card-name" id="cName"></h2>
        <p class="card-key" id="cKey"></p>
        <p class="card-five" id="cFive"></p>
        <p class="card-stars"><span class="star" aria-hidden="true">★</span> <b id="cStars">0</b> <span id="cStarsWord">stars on this device</span></p>
        <button type="button" class="card-trophies" id="cTrophies" aria-expanded="false" aria-controls="cTrophyList" hidden><span aria-hidden="true">🏆</span> <b id="cTrophyN">0</b>× weekly champion</button>
        <ul class="card-trophy-list" id="cTrophyList" hidden></ul>
        <div class="horn-toggle" id="hornToggle" role="group" aria-labelledby="hornLbl" hidden>
          <span id="hornLbl">Starting notes:</span>
          <button type="button" data-horn="F">F–C</button><button type="button" data-horn="C">C–G</button>
        </div>
        <button type="button" class="card-backup" id="backupBtn" aria-haspopup="dialog">Backup / Restore</button>
        <button type="button" class="btn-skins" id="skinsBtn" aria-haspopup="dialog"><span>Locker</span> <small id="skinsCount"></small></button>
        <button type="button" class="btn-select" id="selectBtn">Select</button>
      </div>
    </aside>

    <section class="grid-wrap" aria-labelledby="gridTitle">
      <h2 class="sr" id="gridTitle">Instruments</h2>
      <div class="grid" id="grid" role="group" aria-label="Instruments. Arrow keys move, Enter selects"></div>
      <ul class="legend" aria-label="Sections">
        <li class="fam-woodwind">Woodwinds</li><li class="fam-brass">Brass</li><li class="fam-percussion">Percussion</li>
      </ul>
    </section>
  </div>
</div>

<!-- THE LOCKER: avatar items (shared/avatar-parts.js unlocks, worn everywhere) + skins (shared/skins.js, per instrument) -->
<!-- PLAYER 1 READY: a flash across the screen, then the game -->
<div class="ready" id="ready" hidden aria-live="assertive"><div class="flash"></div><p><span>Player 1</span><span>Ready</span></p></div>
</div>
