<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Band Arcade</title>
<meta name="description" content="Band practice games that listen to you play.">
<meta name="theme-color" content="#0f1d36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Band Arcade">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="shared/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="arcade.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <h1 id="arcadeName">Band Arcade</h1>
      <p id="arcadeTagline"></p>
    </div>
    <div class="hero-ghosts" id="heroGhosts" aria-hidden="true"></div>
  </header>

  <section aria-labelledby="stepInst">
    <p class="eyebrow" id="stepInst">1 · Choose your instrument</p>
    <div class="inst-grid" id="instGrid"></div>
  </section>

  <section aria-labelledby="stepGame" class="games-section">
    <p class="eyebrow" id="stepGame">2 · Choose a game</p>
    <div class="games" id="gameGrid"></div>
    <p class="note" id="demoNote" hidden>Demo mode: hold keys 1–5 to play the five notes. All levels unlocked.</p>
  </section>
</div>

<script src="shared/instruments.js"></script>
<script src="shared/storage.js"></script>
<script src="shared/pitch.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/games.js"></script>
<script src="arcade.js"></script>
</body>
</html>
